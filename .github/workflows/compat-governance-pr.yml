name: Compat Governance PR Gates

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches: [main, master]
        paths:
            - ".github/workflows/compat-governance-pr.yml"
            - ".github/workflows/compat-governance-release.yml"
            - "ci/oracle-compare.yml"
            - "ci/feature-matrix.yml"
            - "ci/gpu-bench.yml"
            - "ci/api-value-baseline.sh"
            - "ci/benchmark-thresholds.json"
            - "benches/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - "rust-toolchain.toml"
            - "crates/**"
            - "xtask/**"
            - "docs/**"
    workflow_dispatch:
    schedule:
        - cron: "0 4 * * *"

concurrency:
    group: compat-governance-pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CINTX_REQUIRED_PROFILES: base,with-f12,with-4c1e,with-f12+with-4c1e

jobs:
    manifest_drift_gate:
        name: manifest_drift_gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve pinned Rust channel
              id: rust
              run: |
                  python <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  data = tomllib.loads(Path("rust-toolchain.toml").read_text())
                  toolchain = data.get("toolchain", {})
                  channel = toolchain.get("channel")
                  if not channel:
                      raise SystemExit("failed to resolve channel from rust-toolchain.toml")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write(f"channel={channel}\n")
                  PY

            - name: Install pinned Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}

            - name: Cache Rust artifacts
              uses: Swatinem/rust-cache@v2

            - name: Run manifest drift gate
              run: |
                  cargo run --manifest-path xtask/Cargo.toml -- manifest-audit --profiles "${CINTX_REQUIRED_PROFILES}" --check-lock

            - name: Run ECP K-Taylor table drift gate
              run: |
                  cargo run --manifest-path xtask/Cargo.toml --locked -- gen-ecp-tables --check

            - name: Run Rys Jacobi/Flocke table drift gate
              run: |
                  cargo run --manifest-path xtask/Cargo.toml --locked -- gen-rys-tables --check

            - name: Run cart-to-sph table drift gate
              run: |
                  cargo run --manifest-path xtask/Cargo.toml --locked -- gen-c2s-table --check

            - name: Run cart-to-spinor table drift gate
              run: |
                  cargo run --manifest-path xtask/Cargo.toml --locked -- gen-c2spinor-table --check

    oracle_parity_gate:
        name: oracle_parity_gate (${{ matrix.profile }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                profile: [base, with-f12, with-4c1e, "with-f12+with-4c1e"]
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve pinned Rust channel
              id: rust
              run: |
                  python <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  data = tomllib.loads(Path("rust-toolchain.toml").read_text())
                  toolchain = data.get("toolchain", {})
                  channel = toolchain.get("channel")
                  if not channel:
                      raise SystemExit("failed to resolve channel from rust-toolchain.toml")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write(f"channel={channel}\n")
                  PY

            - name: Install pinned Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}

            - name: Cache Rust artifacts
              uses: Swatinem/rust-cache@v2

            - name: Run oracle parity gate for ${{ matrix.profile }}
              run: |
                  CINTX_BACKEND=cpu cargo run --manifest-path xtask/Cargo.toml -- oracle-compare --profiles "${{ matrix.profile }}" --include-unstable-source false

            # `extended-device-rys` is required, not optional, for this step:
            # the budget's def2 high-order fixture sets exist to record the
            # nroots 6-7 envelope, and a build without the feature refuses those
            # classes instead of measuring them (and skips the sets, saying so).
            - name: Ratchet precision headroom for ${{ matrix.profile }}
              run: |
                  CINTX_ORACLE_BUILD_VENDOR=1 CINTX_BACKEND=cpu cargo run --release --manifest-path xtask/Cargo.toml --features cpu,extended-device-rys -- error-budget --profiles "${{ matrix.profile }}" --check-headroom

    # def2_speed_precision_plan.md D5.1. PR CI runs the def2 gates that are
    # cheap and deterministic: the launch-class census (G1/G2), the
    # one-launch-per-signature check (D2.2), and the prewarm's coverage. The
    # throughput benchmark is NOT here — a timing on a shared runner is a
    # number about the runner, and the plan's G5 says a speed claim needs the
    # work list, coverage and match status behind it. It runs nightly on the
    # release workflow instead.
    def2_coverage_gate:
        name: def2_coverage_gate
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve pinned Rust channel
              id: rust
              run: |
                  python <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  data = tomllib.loads(Path("rust-toolchain.toml").read_text())
                  toolchain = data.get("toolchain", {})
                  channel = toolchain.get("channel")
                  if not channel:
                      raise SystemExit("failed to resolve channel from rust-toolchain.toml")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write(f"channel={channel}\n")
                  PY

            - name: Install pinned Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}

            - name: Cache Rust artifacts
              uses: Swatinem/rust-cache@v2

            - name: Run def2 coverage and consolidation gates
              run: |
                  CINTX_ORACLE_BUILD_VENDOR=1 cargo test --release --locked -p cintx-oracle \
                    --features cpu,extended-device-rys \
                    --test def2_device_coverage \
                    --test def2_prewarm_and_consolidation \
                    --test def2_prewarm_cold_start \
                    --test def2_throughput_benchmark

            - name: Run the same coverage census with the extended path OFF
              run: |
                  CINTX_ORACLE_BUILD_VENDOR=1 cargo test --release --locked -p cintx-oracle \
                    --features cpu \
                    --test def2_device_coverage \
                    --test def2_prewarm_and_consolidation

            - name: Upload def2 coverage artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: def2-coverage-${{ github.run_id }}
                  if-no-files-found: warn
                  path: |
                      /tmp/cintx_artifacts/cintx_def2_coverage.json

    helper_legacy_parity_gate:
        name: helper_legacy_parity_gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve pinned Rust channel
              id: rust
              run: |
                  python <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  data = tomllib.loads(Path("rust-toolchain.toml").read_text())
                  toolchain = data.get("toolchain", {})
                  channel = toolchain.get("channel")
                  if not channel:
                      raise SystemExit("failed to resolve channel from rust-toolchain.toml")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write(f"channel={channel}\n")
                  PY

            - name: Install pinned Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}

            - name: Cache Rust artifacts
              uses: Swatinem/rust-cache@v2

            - name: Run helper legacy parity gate for required profiles
              run: |
                  for profile in base with-f12 with-4c1e with-f12+with-4c1e; do
                    cargo run --manifest-path xtask/Cargo.toml -- helper-legacy-parity --profile "${profile}"
                  done

    oom_contract_gate:
        name: oom_contract_gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve pinned Rust channel
              id: rust
              run: |
                  python <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  data = tomllib.loads(Path("rust-toolchain.toml").read_text())
                  toolchain = data.get("toolchain", {})
                  channel = toolchain.get("channel")
                  if not channel:
                      raise SystemExit("failed to resolve channel from rust-toolchain.toml")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write(f"channel={channel}\n")
                  PY

            - name: Install pinned Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}

            - name: Cache Rust artifacts
              uses: Swatinem/rust-cache@v2

            - name: Run OOM contract gate for required profiles
              run: |
                  for profile in base with-f12 with-4c1e with-f12+with-4c1e; do
                    echo "running oom-contract-check for profile=${profile} (base,with-f12,with-4c1e,with-f12+with-4c1e)"
                    cargo run --manifest-path xtask/Cargo.toml -- oom-contract-check
                  done

    api_value_baseline_gate:
        name: api_value_baseline_gate
        runs-on: ubuntu-latest
        env:
            CINTX_REQUIRED_PROFILES: base,with-f12,with-4c1e,with-f12+with-4c1e
            CINTX_MUTANTS_SHARD: 1/30
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve pinned Rust channel
              id: rust
              run: |
                  python <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  data = tomllib.loads(Path("rust-toolchain.toml").read_text())
                  toolchain = data.get("toolchain", {})
                  channel = toolchain.get("channel")
                  if not channel:
                      raise SystemExit("failed to resolve channel from rust-toolchain.toml")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write(f"channel={channel}\n")
                  PY

            - name: Install pinned Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}

            - name: Cache Rust artifacts
              uses: Swatinem/rust-cache@v2

            - name: Run API value baseline gate
              run: ci/api-value-baseline.sh

    feature_matrix_gate:
        name: feature_matrix_gate (${{ matrix.cell }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - cell: cpu-only
                      features: ""
                    - cell: cpu+wgpu
                      features: "wgpu"
                    - cell: all-features
                      features: "wgpu,cuda,rocm,metal"
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve pinned Rust channel
              id: rust
              run: |
                  python <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  data = tomllib.loads(Path("rust-toolchain.toml").read_text())
                  toolchain = data.get("toolchain", {})
                  channel = toolchain.get("channel")
                  if not channel:
                      raise SystemExit("failed to resolve channel from rust-toolchain.toml")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write(f"channel={channel}\n")
                  PY

            - name: Install pinned Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}

            - name: Cache Rust artifacts
              uses: Swatinem/rust-cache@v2

            - name: Install ROCm runtime headers (cubecl-hip-sys build script needs hipconfig)
              if: matrix.cell == 'all-features'
              run: |
                  wget https://repo.radeon.com/amdgpu-install/6.0/ubuntu/jammy/amdgpu-install_6.0.60000-1_all.deb
                  sudo apt-get install -y ./amdgpu-install_6.0.60000-1_all.deb
                  sudo amdgpu-install --usecase=rocm --no-dkms -y
                  echo "/opt/rocm/bin" >> $GITHUB_PATH

            - name: cargo check
              run: |
                  if [ -z "${{ matrix.features }}" ]; then
                    cargo check -p cintx-cubecl
                  else
                    cargo check -p cintx-cubecl --features "${{ matrix.features }}"
                  fi

            - name: cargo test (excluding ignored)
              run: |
                  if [ -z "${{ matrix.features }}" ]; then
                    cargo test -p cintx-cubecl
                  else
                    cargo test -p cintx-cubecl --features "${{ matrix.features }}"
                  fi

    gpu_bench_advisory:
        name: gpu_bench_advisory
        runs-on: ubuntu-latest
        continue-on-error: true
        env:
            CINTX_ARTIFACT_DIR: /tmp/cintx_artifacts/cintx/pr-gpu-bench/${{ github.run_id }}
            CINTX_BENCH_PROFILE: advisory-pr
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve pinned Rust channel
              id: rust
              run: |
                  python <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  data = tomllib.loads(Path("rust-toolchain.toml").read_text())
                  toolchain = data.get("toolchain", {})
                  channel = toolchain.get("channel")
                  if not channel:
                      raise SystemExit("failed to resolve channel from rust-toolchain.toml")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write(f"channel={channel}\n")
                  PY

            - name: Install pinned Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}

            - name: Cache Rust artifacts
              uses: Swatinem/rust-cache@v2

            - name: Prepare artifact directories
              run: |
                  mkdir -p "${CINTX_ARTIFACT_DIR}"
                  rm -f /tmp/cintx_artifacts/cintx_phase_04_bench_rows.jsonl

            - name: Run GPU benchmark suites (advisory)
              run: |
                  # Keep commands aligned with ci/gpu-bench.yml policy template.
                  cargo bench -p cintx --bench micro_families --bench macro_molecules --bench crossover_cpu_gpu
                  cargo run --manifest-path xtask/Cargo.toml -- bench-report --thresholds ci/benchmark-thresholds.json --mode enforce

            - name: Upload GPU advisory artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: gpu-bench-advisory-${{ github.run_id }}
                  if-no-files-found: warn
                  path: |
                      ${{ env.CINTX_ARTIFACT_DIR }}
                      /tmp/cintx_artifacts/cintx_phase_04_bench_rows.jsonl
                      /tmp/cintx_artifacts/cintx_phase_04_bench_report.json
                      /tmp/cintx_artifacts/cintx_phase_04_runtime_diagnostics.json
                      /tmp/cintx_artifacts/cintx_phase_04_bench_report.json
                      /tmp/cintx_artifacts/cintx_phase_04_runtime_diagnostics.json
                      target/criterion

    wgpu_capability_advisory:
        name: wgpu_capability_advisory
        runs-on: ubuntu-latest
        continue-on-error: true
        env:
            CINTX_ARTIFACT_DIR: /tmp/cintx_artifacts
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve pinned Rust channel
              id: rust
              run: |
                  python <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  data = tomllib.loads(Path("rust-toolchain.toml").read_text())
                  toolchain = data.get("toolchain", {})
                  channel = toolchain.get("channel")
                  if not channel:
                      raise SystemExit("failed to resolve channel from rust-toolchain.toml")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write(f"channel={channel}\n")
                  PY

            - name: Install pinned Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}

            - name: Cache Rust artifacts
              uses: Swatinem/rust-cache@v2

            - name: Prepare artifact directories
              run: |
                  mkdir -p "${CINTX_ARTIFACT_DIR}"

            - name: Run wgpu capability gate (advisory)
              run: |
                  cargo run --locked --manifest-path xtask/Cargo.toml -- wgpu-capability-gate --profiles "${CINTX_REQUIRED_PROFILES}" --require-adapter false

            - name: Upload phase-5 capability advisory artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: wgpu-capability-advisory-${{ github.run_id }}
                  if-no-files-found: warn
                  path: |
                      /tmp/cintx_artifacts/cintx_phase_05_wgpu_capability_gate.json
                      /tmp/cintx_artifacts/cintx_phase_05_wgpu_capability_gate.json

    unstable_source_oracle:
        name: "unstable_source_oracle (nightly)"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        env:
            CINTX_ORACLE_BUILD_VENDOR: "1"
            CINTX_ARTIFACT_DIR: /tmp/cintx_artifacts
            CINTX_BACKEND: cpu
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve pinned Rust channel
              id: rust
              run: |
                  python <<'PY'
                  import os
                  import tomllib
                  from pathlib import Path

                  data = tomllib.loads(Path("rust-toolchain.toml").read_text())
                  toolchain = data.get("toolchain", {})
                  channel = toolchain.get("channel")
                  if not channel:
                      raise SystemExit("failed to resolve channel from rust-toolchain.toml")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write(f"channel={channel}\n")
                  PY

            - name: Install pinned Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-unstable-${{ hashFiles('**/Cargo.lock') }}

            - name: Run unstable-source oracle parity
              run: |
                  cargo test -p cintx-oracle --features cpu,unstable-source-api --test unstable_source_parity -- --test-threads=1

            - name: Run xtask unstable-source oracle-compare
              run: |
                  cargo run --manifest-path xtask/Cargo.toml -- oracle-compare \
                    --profiles "unstable-source" \
                    --include-unstable-source true

            - name: Upload unstable-source oracle artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: unstable-source-oracle-${{ github.run_id }}
                  if-no-files-found: warn
                  path: |
                      /tmp/cintx_artifacts/cintx_phase_04_oracle_compare_unstable_source.json
                      /tmp/cintx_artifacts/cintx_phase_04_oracle_matrix_unstable_source.json
                      /tmp/cintx_artifacts/cintx_phase_04_oracle_compare_unstable_source.json
                      /tmp/cintx_artifacts/cintx_phase_04_oracle_matrix_unstable_source.json
