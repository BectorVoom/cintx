[package]
name = "cintx-oracle"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = []
cpu = ["cintx-compat/cpu"]
with-4c1e = ["cintx-compat/with-4c1e"]
with-f12 = ["cintx-compat/with-f12"]
unstable-source-api = ["cintx-compat/unstable-source-api"]
# Forwards `cintx-compat/rocm` (which forwards to `cintx-cubecl/rocm`) so
# `cargo test -p cintx-oracle --features rocm` transitively activates the
# rocm backend (cubecl-hip). Required for the opt-in ROCm oracle base-family
# suite (Phase 16-04 / D-15) — tests are gated `#[cfg(feature = "rocm")]
# #[ignore]` and are only triggered via `xtask rocm-oracle` (which sets
# `CINTX_ROCM_ORACLE=1`).
rocm = ["cintx-compat/rocm"]
# The CUDA sibling of the `rocm` feature above, for the same reason: it forwards
# `cintx-compat/cuda` so `cargo test -p cintx-oracle --features cuda` activates
# the cubecl-cuda backend. `.planning/notes/cuda-metal-verification-gap.md`
# records CUDA as compile-only; `def2_cuda_verification` is what a real device
# runs to change that, gated `#[ignore]` behind `CINTX_CUDA_ORACLE=1` exactly as
# the ROCm suite is.
cuda = ["cintx-compat/cuda"]
# The GTH-MOLOPT fixtures (`gth_*` tests and the GTH rows of the throughput
# benchmark). Opt-in for the same reason `cintx-basis/gth` is: the vendored
# CP2K data is GPLv2 and a default build must not embed it.
gth = ["cintx-basis/gth"]
# Task 33-03: unlocks the inline extended Rys entry for the families that
# have been flipped, so their parity gates can run against it.
extended-device-rys = [
    "cintx-compat/extended-device-rys",
    "cintx-cubecl/extended-device-rys",
]

[dependencies]
anyhow = "1.0.102"
cintx-compat = { path = "../cintx-compat" }
cintx-core = { path = "../cintx-core" }
cintx-ops = { path = "../cintx-ops" }
cintx-rs = { path = "../cintx-rs", default-features = false }
cintx-runtime = { path = "../cintx-runtime", default-features = false }
serde_json = "1.0.145"

[dev-dependencies]
cintx-simd = { path = "../cintx-simd" }
cintx-basis = { path = "../cintx-basis" }
cintx-driver = { path = "../cintx-driver" }
wide = "1.6"
approx = "0.5"
# Phase 25 FND-02: the nroots-sweep parity test exercises the host Rys
# `rys_roots_host` engine (cintx-cubecl::math::rys) directly against the
# vendored `CINTrys_roots`. Host-only path; no GPU backend feature needed.
cintx-cubecl = { path = "../cintx-cubecl", default-features = false }
# Phase 26 FND-03: the giao_complex_roundtrip test names the safe-API
# `Complex<f64>` view type returned by `IntegralTensor::complex_values()`.
# Pinned to the same 0.4 line as cintx-rs (single resolved graph).
num-complex = "0.4"

[build-dependencies]
bindgen = "0.71.1"
cc = "1.2.15"
