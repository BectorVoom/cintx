[package]
name = "cintx-compat"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = []
cpu = ["cintx-cubecl/cpu"]
with-f12 = ["cintx-cubecl/with-f12"]
with-4c1e = ["cintx-cubecl/with-4c1e"]
unstable-source-api = ["cintx-cubecl/unstable-source-api"]
# Forwards `cintx-cubecl/rocm`. Required for the Phase 16-04 opt-in ROCm
# oracle base-family suite (D-15) — exposes the rocm runtime through the
# compat path so cintx-oracle (which depends on cintx-compat, not cintx-cubecl
# directly) can transitively activate it via `--features rocm`.
rocm = ["cintx-cubecl/rocm"]

[dependencies]
cintx-core = { path = "../cintx-core" }
cintx-cubecl = { path = "../cintx-cubecl" }
cintx-ops = { path = "../cintx-ops" }
cintx-runtime = { path = "../cintx-runtime" }
smallvec = "1"
tracing = "0.1"
