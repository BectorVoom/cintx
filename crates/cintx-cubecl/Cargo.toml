[package]
name = "cintx-cubecl"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = ["cpu", "wgpu"]
cpu = ["cubecl/cpu"]
# Wave-0 (Phase 16-01) introduces `wgpu` as a default-on placeholder feature so
# `#[cfg(feature = "wgpu")]` test gates compile today (no behavior change). Wave 1
# rewires this to `wgpu = ["dep:cubecl-wgpu", "dep:wgpu"]` and drops it from default
# per D-04/D-07.
wgpu = []
with-f12 = []
with-4c1e = []
unstable-source-api = []

[dependencies]
cintx-core = { path = "../cintx-core" }
cintx-ops = { path = "../cintx-ops" }
cintx-runtime = { path = "../cintx-runtime" }
bytemuck = { version = "1", features = ["derive"] }
cubecl = { version = "0.10.0", features = ["wgpu"] }
cubecl-wgpu = "0.10.0"
cubecl-runtime = "0.10.0"
smallvec = "1"
tracing = "0.1"
wgpu = "29.0.3"

[dev-dependencies]
approx = "0.5"
