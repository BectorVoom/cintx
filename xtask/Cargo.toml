[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "xtask"
path = "src/main.rs"

[features]
default = []
# Forward the CPU compute backend down to cintx-oracle/compat so the vendor
# parity path (oracle-covered-update / oracle-compare) drives the real CPU
# kernels. Double-gated with CINTX_ORACLE_BUILD_VENDOR=1 for byte-identity
# parity (reference_oracle_vendor_parity_invocation).
cpu = ["cintx-oracle/cpu", "cintx-compat/cpu"]
# The extended device Rys path (nroots 6..12). `error-budget` needs it: its
# def2-shaped fixture sets exist precisely to record the envelope of the
# nroots 6-7 classes, and without the feature those classes are refused (fail
# closed, correctly) rather than measured.
extended-device-rys = [
    "cintx-oracle/extended-device-rys",
    "cintx-compat/extended-device-rys",
]

[dependencies]
anyhow = "1.0.102"
bytemuck = "1"
cintx-compat = { path = "../crates/cintx-compat", features = ["with-f12", "with-4c1e", "unstable-source-api"] }
cintx-ops = { path = "../crates/cintx-ops" }
cintx-oracle = { path = "../crates/cintx-oracle", features = ["unstable-source-api"] }
cintx-cubecl = { path = "../crates/cintx-cubecl", default-features = false }
serde_json = "1.0.145"

[workspace]
